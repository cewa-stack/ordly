<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Znaczniki PWA dla iOS MUSZA byc w statycznym HTML-u: iOS czyta je
      w chwili uruchomienia aplikacji z ekranu poczatkowego, zanim ruszy
      jakikolwiek skrypt. Wczesniej wstawial je JavaScript, wiec iOS ich
      nie widzial i nad ciemna aplikacja wisial jasny pas paska stanu.

      Styl paska to `black`, nie `black-translucent`: przezroczysty pasek
      ma zawsze BIALY zegar, ktorego nie byloby widac w atmosferze dziennej
      (jasne tlo 6:00-20:00), a do tego wymagalby przesuniecia calego
      ukladu pod wyciecie ekranu. Czarny pasek noca zlewa sie z tlem
      #0A1413, a w dzien pozostaje czytelny.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ORDLY" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS nie czyta ikon z manifestu - wylacznie apple-touch-icon (180 x 180). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* Tlo zanim wczyta sie skrypt - bez bialego mrugniecia przy starcie. */
      html,
      body {
        background-color: #0A1413;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Włącz JavaScript, żeby uruchomić ORDLY.
    </noscript>
    <div id="root"></div>
  </body>
</html>
