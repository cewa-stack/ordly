<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!--
      `font-src 'self' data:` jest konieczne: Vite wkleja male pliki
      fontow jako data: URI, a bez tej dyrektywy `default-src 'self'`
      je blokuje i cala aplikacja leci na systemowym Segoe UI zamiast
      na Bricolage Grotesque / Instrument Sans / JetBrains Mono.
      `data:` to tresc osadzona w bundlu, nie zapytanie do sieci.

      `img-src` musi dopuszczac `https:`, bo miniatury ofert i pozycji
      zamowienia to zdjecia z CDN marketplace'u (a.allegroimg.com).
      Bez tego `<img>` w Magazynie i w panelu szczegolu zamowienia byl
      cicho blokowany - kazda oferta pokazywala zastepcza ikone, tak
      jakby backend nie oddawal adresu zdjecia. To dotyczy WYLACZNIE
      obrazow; `script-src` zostaje przy 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORDLY Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
