# Pakowanie aplikacji desktopowej ORDLY do plikow .exe (Windows).
#
# Powstaja dwa pliki w katalogu `release/`:
#   ORDLY-Setup-<wersja>.exe  - instalator (skrot na pulpicie, menu Start,
#                               odinstalowanie przez Panel sterowania)
#   ORDLY-<wersja>.exe        - wersja przenosna, odpalana bez instalacji
#
# Aplikacja NIE jest podpisana certyfikatem - przy pierwszym uruchomieniu
# Windows SmartScreen pokaze ostrzezenie "Nieznany wydawca". To normalne
# dla aplikacji budowanej samodzielnie; podpisanie wymaga platnego
# certyfikatu Authenticode.
appId: pl.ordly.desktop
productName: ORDLY
copyright: ORDLY

directories:
  buildResources: build
  output: release

# Do paczki trafia wylacznie zbudowany kod - `src/` i `node_modules`
# warstwy renderera sa juz w bundlu z electron-vite.
files:
  - out/**/*
  - package.json

asar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ORDLY-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ORDLY
  artifactName: ORDLY-Setup-${version}.${ext}

portable:
  artifactName: ORDLY-${version}-portable.${ext}
